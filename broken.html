<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Policeman Sandbox</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-900 text-white flex justify-center items-center min-h-screen p-4">
    <div id="product-card" class="bg-slate-800 p-6 rounded-2xl shadow-xl flex flex-col sm:flex-row gap-6 max-w-[600px] w-full border border-slate-700">
      <div class="w-full sm:w-1/2 sm:shrink-0 aspect-[3/2] sm:aspect-auto sm:min-h-[200px] bg-indigo-600 rounded-xl flex items-center justify-center p-4 font-bold text-lg text-center">[Product Image Placeholder]</div>
      <div class="flex min-w-0 flex-1 flex-col justify-between">
        <div>
          <span class="text-xs font-semibold tracking-widest text-emerald-400 uppercase">Layout Fixed</span>
          <h1 class="text-xl sm:text-2xl font-black mt-1 tracking-tight leading-tight text-slate-100 break-words">The Responsive Card Component</h1>
          <p class="text-sm text-slate-400 mt-2 break-words">The card now stacks vertically on small screens and sits side by side from the `sm` breakpoint up. Widths are fluid instead of hardcoded, so nothing overflows or crushes the content.</p>
        </div>
        <button class="mt-4 bg-indigo-500 text-white font-semibold py-2 px-4 rounded-xl hover:bg-indigo-600 transition-colors w-full cursor-pointer">Investigate Layout</button>
      </div>
    </div>
  </body>
</html>
